name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate framework structure
        shell: pwsh
        run: ./tools/wiki_check.ps1 -IncludeWarnings

      - name: Test change scanner
        shell: pwsh
        run: ./tools/tests/test_scan_changes.ps1
