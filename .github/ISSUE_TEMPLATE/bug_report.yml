name: Bug report
description: Report a reproducible framework or automation defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, personal records, and private paths before submitting.

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Edit ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, PowerShell 7.6, Git 2.56, Obsidian ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste redacted output from wiki_check or relevant logs.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal information from this report.
          required: true
