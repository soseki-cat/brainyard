name: Feature request
description: Propose a reusable improvement to the framework.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reusable problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome, not only the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The proposal keeps raw material read-only by default.
          required: true
        - label: The proposal does not require personal data in the default template.
          required: true
